<div *ngIf="contact" class="row">
  <div class="col-md-12">
    <h3 *ngIf="contact._id">Детали контакта</h3>
    <h2 *ngIf="!contact._id">Новый контакт</h2>
  </div>
</div>
<div *ngIf="contact" class="row">
  <form class="col-md-12">
    <div class="form-group">
      <label for="name">Имя</label>
      <input id="name" class="form-control" name="name" [(ngModel)]="contact.name" placeholder="Name" />
    </div>
    <div class="form-group">
      <label for="email">Электронная почта</label>
      <input id="email" class="form-control" name="email" [(ngModel)]="contact.email" placeholder="supnewport@mirea.ru" />
    </div>
    <div class="form-group">
      <label for="mobile">Мобильный телефон</label>
      <input id="mobile" class="form-control" name="mobile" [(ngModel)]="contact.phone.mobile" placeholder="84971220345200125" />
    </div>
    <div class="form-group">
      <label for="work">Рабочий телефон</label>
      <input id="work" class="form-control" name="work" [(ngModel)]="contact.phone.work" placeholder="8800235000047" />
    </div>
    <button type="button" class="btn btn-primary" *ngIf="!contact._id" (click)="createContact(contact)">Создать контакт</button>
    <button type="button" class="btn btn-info" *ngIf="contact._id" (click)="updateContact(contact)">Обновить контакт</button>
    <button type="button" class="btn btn-danger" *ngIf="contact._id" (click)="deleteContact(contact._id!)">Удалить контакт</button>
  </form>
</div>
